name = "qwenpaw-keepalive"
main = "src/index.js"
compatibility_date = "2026-11-14"

# Every 5 minutes, UTC. User choice: 5-min ping for least sleep on Free.
[triggers]
crons = ["*/5 * * * *"]

[vars]
# Public InstaBox URL of the published QwenPaw port. Replace with YOUR URL:
#   https://8088-<machine-id-without-m_>.instabox.tech/
QWENPAW_URL = "https://8088-agq5wqqo2fvypym7rjlpvngc2m.instabox.tech/"
# Machine id for the optional API-wake fallback. "m_..." form.
INSTABOX_MACHINE_ID = "m_agq5wqqo2fvypym7rjlpvngc2m"
# D1 store flag: "1" = use the qwenpaw-state D1 database when its binding
# is present; anything else = the KV namespace below (fallback).
USE_D1 = "1"
# Pages Worker origin (the sleep executor — it holds INSTABOX_API_KEY).
# The keep-alive Worker asks Pages to suspend via POST /api/machine/sleep.
PAGES_URL = "https://qwenpawx.pages.dev"
# Secrets (set via the API, never in this file):
#   REPORTER_TOKEN — the machine reporter authenticates POST /report with it.
#   SLEEP_TOKEN    — the keep-alive Worker authenticates POST /api/machine/sleep on Pages with it.
#   WAKE_TOKEN     — POST /wake requires header X-Wake-Token to match.
#   INSTABOX_API_KEY — optional API-wake fallback (NOT set today; the public-URL probe is the wake path).

# KV namespace for last-known status. Create first:
#   wrangler kv namespace create STATUS
# then paste the returned id here.
[[kv_namespaces]]
binding = "STATUS"
id = "6a91d8099ed8419c88c94b0946186a27"

# D1 database (created 2026-11-15, uuid below). The store in src/index.js
# uses D1 when USE_D1 = "1" and this binding is present, and falls back
# to the KV namespace above otherwise. KV is the fallback, not the
# primary: its 1,000 writes/day account cap was burned twice in 2026-11-15.
[[d1_databases]]
binding = "QWENPAW_DB"
database_name = "qwenpaw-state"
database_id = "5f58a2f8-e4bb-45e5-8a94-4fc283b90871"
