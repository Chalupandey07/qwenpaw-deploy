name = "qwenpaw-codemode"
main = "src/index.js"
compatibility_date = "2026-11-14"

# ============================================================================
# RETIRED 2026-11-16. DO NOT DEPLOY THIS.
#
# `worker_loaders` (Dynamic Workers) requires a PAID Cloudflare plan. Verified
# live: the Workers API returns 403 code 10195. The account is on the free
# tier and a paid plan is out of scope, so this Worker cannot run the job it
# was written for.
#
# This file is kept as the RECORD of what was tried, and because its
# benchmark arithmetic is still the measurement of record (the VM runner
# reuses it verbatim so the numbers stay comparable). Execution now happens
# on the InstaBox VM: features/codemode/vm/ + qwenpaw-codemode.service.
#
# The binding below stays ENABLED in history's name only — enabling it is what
# produced the 10195 that settled the question. Deploying again would spend a
# deploy to re-learn a known answer.
# ============================================================================

# Phase 5 Code Mode PILOT. Read features/codemode/README.md first.
#
# There is deliberately NO KV namespace and NO Durable Object here yet:
#   - KV writes are the scarce resource on this account (the 1,000/day quota
#     incident burned takeover/mode/needs-you for a whole day), and the pilot
#     does not need durable state to measure anything.
#   - A Durable Object + CodemodeRuntime facet is only worth deploying once
#     the benchmark justifies it. The runtime path needs a `ctx.exports`
#     facet class, which requires the real @cloudflare/codemode build step.
#
# The binding that answered the question. Kept enabled because disabling it
# would erase the evidence: it is the declaration whose deploy returned
# 403 / 10195.

[[worker_loaders]]
binding = "LOADER"

[vars]
# Set with: wrangler secret put CODEMODE_TOKEN      (required for /api/run)
#           wrangler secret put MCP_SSE_URL         (token-auth SSE of the MCP proxy)
#           wrangler secret put MCP_SSE_TOKEN
# Never put a token in this file.

[observability]
enabled = true
