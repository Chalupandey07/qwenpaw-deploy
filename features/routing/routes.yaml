# Route table for content-aware model routing.
#
# Read by features/routing/policy.py. Shape:
#   routes:       list of routes; the FIRST match wins ties only by score
#   default_route: used when the router abstains (keep the configured default)
#   threshold:    minimum confidence to route at all (0.5 = better than a coin)
#   margin:       minimum gap to the runner-up (below this, abstain)
#
# IMPORTANT: an abstention is a feature. When the router is unsure the caller
# keeps QwenPaw's configured default, so a bad route table degrades to today's
# behaviour instead of to a wrong decision.
#
# `cheap` and `deep` are ROLE names, not model names. Map them to real models
# in the QwenPaw config (today: cheap = mosicn/nex-n2.6, deep = Astra), so the
# table survives a model swap.

default_route: cheap
threshold: 0.5
margin: 0.12

routes:
  # Short, mechanical work: summarise, rename, format, look something up.
  - name: cheap
    weight: 1.0
    terms:
      - summarise
      - summarize
      - summary
      - list
      - rename
      - format
      - ticket
      - status
      - count
      - extract

  # Anything that needs the desktop or the browser. `requires_tools` makes the
  # router prefer this route only when tools are actually available, and
  # penalise it when they are not (a desktop request with no tools available
  # is a configuration problem, not a routing choice).
  - name: tools
    weight: 1.2
    requires_tools: true
    tools_bonus: 1.0
    tools_penalty: 1.5
    terms:
      - click
      - screenshot
      - desktop
      - browser
      - navigate
      - open
      - type
      - scroll
      - terminal

  # Code work benefits from a stronger model more than chat does.
  - name: code
    weight: 1.2
    terms:
      - refactor
      - function
      - bug
      - test
      - commit
      - python
      - javascript
      - typescript
      - regex
      - stack
      - traceback

  # Reasoning-heavy questions. The length gate stops a one-word prompt that
  # merely contains "why" from being escalated.
  - name: deep
    weight: 1.4
    min_tokens: 8
    length_bonus: 0.5
    length_penalty: 0.6
    patterns:
      - '\bwhy\b'
      - '\btrade-?offs?\b'
      - '\broot cause\b'
      - '\barchitecture\b'
    terms:
      - architecture
      - design
      - analyse
      - analyze
      - explain
      - compare
      - strategy
